<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Fabiq runtime data flow</title>
  <desc id="desc">Step-by-step runtime flow from simulator events through Kafka, backend API, Postgres, and React dashboard.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748B"/>
    </marker>
    <style>
      .bg { fill: #F8FAFC; }
      .title { font: 700 26px Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .lane { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; rx: 18; }
      .step { font: 700 15px Arial, sans-serif; fill: #0F172A; }
      .text { font: 400 13px Arial, sans-serif; fill: #475569; }
      .num { font: 700 14px Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #64748B; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="900" height="560" rx="24"/>
  <text class="title" x="450" y="44" text-anchor="middle">Runtime Data Flow</text>
  <text class="subtitle" x="450" y="70" text-anchor="middle">How simulated factory activity becomes stored history and live dashboard data</text>

  <rect class="lane" x="90" y="115" width="720" height="68"/>
  <circle cx="130" cy="149" r="18" fill="#38BDF8"/><text class="num" x="130" y="149">1</text>
  <text class="step" x="170" y="143">Machine simulator creates events</text>
  <text class="text" x="170" y="163">Machine status, production counts, scrap, downtime, and work-order activity</text>

  <rect class="lane" x="90" y="215" width="720" height="68"/>
  <circle cx="130" cy="249" r="18" fill="#F59E0B"/><text class="num" x="130" y="249">2</text>
  <text class="step" x="170" y="243">Kafka carries manufacturing streams</text>
  <text class="text" x="170" y="263">Topics such as machine.status, production.counts, and downtime.events</text>

  <rect class="lane" x="90" y="315" width="720" height="68"/>
  <circle cx="130" cy="349" r="18" fill="#22C55E"/><text class="num" x="130" y="349">3</text>
  <text class="step" x="170" y="343">Backend validates and processes events</text>
  <text class="text" x="170" y="363">ASP.NET Core services update machine state, counts, downtime, OEE, and traceability</text>

  <rect class="lane" x="90" y="415" width="720" height="68"/>
  <circle cx="130" cy="449" r="18" fill="#A855F7"/><text class="num" x="130" y="449">4</text>
  <text class="step" x="170" y="443">Postgres stores manufacturing history</text>
  <text class="text" x="170" y="463">Work orders, production events, downtime records, and part traceability data</text>

  <path class="arrow" d="M450 184 V205"/>
  <path class="arrow" d="M450 284 V305"/>
  <path class="arrow" d="M450 384 V405"/>

  <rect x="590" y="485" width="220" height="42" rx="14" fill="#FFE4E6" stroke="#FB7185"/>
  <text class="step" x="700" y="511" text-anchor="middle">React dashboard reads APIs</text>
  <path class="arrow" d="M590 506 C520 506 470 484 430 468"/>
</svg>
