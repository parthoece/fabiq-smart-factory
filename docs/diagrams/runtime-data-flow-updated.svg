<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-labelledby="title desc">
  <title id="title">Fabiq runtime data flow</title>
  <desc id="desc">Runtime flow showing simulator events through Kafka, backend processing, Postgres storage, React dashboard APIs, telemetry-driven anomaly alerts, and Prometheus/Grafana observability.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748B"/>
    </marker>
    <style>
      .bg { fill: #F8FAFC; }
      .title { font: 700 28px Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .section { font: 700 14px Arial, sans-serif; fill: #334155; }
      .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.3; rx: 16; }
      .box-blue { fill: #EFF6FF; stroke: #60A5FA; }
      .box-amber { fill: #FFFBEB; stroke: #F59E0B; }
      .box-green { fill: #F0FDF4; stroke: #22C55E; }
      .box-purple { fill: #FAF5FF; stroke: #A855F7; }
      .box-rose { fill: #FFF1F2; stroke: #FB7185; }
      .box-slate { fill: #F8FAFC; stroke: #94A3B8; }
      .step { font: 700 15px Arial, sans-serif; fill: #0F172A; }
      .text { font: 400 12.5px Arial, sans-serif; fill: #475569; }
      .small { font: 400 11.5px Arial, sans-serif; fill: #64748B; }
      .num { font: 700 13px Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #64748B; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-dashed { stroke: #64748B; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="980" height="720" rx="24"/>
  <text class="title" x="490" y="42" text-anchor="middle">Runtime Data Flow</text>
  <text class="subtitle" x="490" y="68" text-anchor="middle">How simulated shop-floor activity becomes history, live KPIs, alerts, and observability</text>

  <text class="section" x="92" y="108">Main MES event pipeline</text>

  <rect class="box box-blue" x="70" y="125" width="205" height="92" rx="16"/>
  <circle cx="98" cy="153" r="15" fill="#38BDF8"/><text class="num" x="98" y="153">1</text>
  <text class="step" x="125" y="149">Machine Simulator</text>
  <text class="text" x="92" y="176">Creates machine status,</text>
  <text class="text" x="92" y="193">production, downtime, scrap,</text>
  <text class="text" x="92" y="210">and telemetry events.</text>

  <rect class="box box-amber" x="365" y="125" width="250" height="92" rx="16"/>
  <circle cx="393" cy="153" r="15" fill="#F59E0B"/><text class="num" x="393" y="153">2</text>
  <text class="step" x="420" y="149">Kafka Event Backbone</text>
  <text class="text" x="388" y="176">machine.status, production.counts,</text>
  <text class="text" x="388" y="193">downtime.events, machine.telemetry,</text>
  <text class="text" x="388" y="210">maintenance.alerts</text>

  <rect class="box box-green" x="705" y="125" width="205" height="92" rx="16"/>
  <circle cx="733" cy="153" r="15" fill="#22C55E"/><text class="num" x="733" y="153">3</text>
  <text class="step" x="760" y="149">Backend API</text>
  <text class="text" x="727" y="176">Consumes events, validates</text>
  <text class="text" x="727" y="193">payloads, updates KPIs,</text>
  <text class="text" x="727" y="210">and exposes REST APIs.</text>

  <path class="arrow" d="M275 171 H355"/>
  <path class="arrow" d="M615 171 H695"/>

  <rect class="box box-purple" x="705" y="285" width="205" height="86" rx="16"/>
  <circle cx="733" cy="312" r="15" fill="#A855F7"/><text class="num" x="733" y="312">4</text>
  <text class="step" x="760" y="308">Postgres</text>
  <text class="text" x="727" y="335">Stores work orders, events,</text>
  <text class="text" x="727" y="352">downtime, alerts, OEE,</text>
  <text class="text" x="727" y="369">and traceability history.</text>

  <rect class="box box-rose" x="365" y="285" width="250" height="86" rx="16"/>
  <circle cx="393" cy="312" r="15" fill="#FB7185"/><text class="num" x="393" y="312">5</text>
  <text class="step" x="420" y="308">React Dashboard</text>
  <text class="text" x="388" y="335">Reads backend APIs for machine</text>
  <text class="text" x="388" y="352">status, OEE, downtime, quality,</text>
  <text class="text" x="388" y="369">traceability, and alerts.</text>

  <path class="arrow" d="M807 217 V275"/>
  <path class="arrow" d="M705 328 H625"/>
  <path class="arrow" d="M705 183 C650 245 625 278 615 318"/>

  <text class="section" x="92" y="435">Telemetry anomaly and alert flow</text>

  <rect class="box box-slate" x="70" y="455" width="205" height="86" rx="16"/>
  <text class="step" x="92" y="486">Telemetry Events</text>
  <text class="text" x="92" y="511">Temperature, vibration,</text>
  <text class="text" x="92" y="528">cycle time, errors, scrap rate</text>

  <rect class="box box-slate" x="365" y="455" width="250" height="86" rx="16"/>
  <text class="step" x="388" y="486">AI Anomaly Worker</text>
  <text class="text" x="388" y="511">Consumes machine.telemetry</text>
  <text class="text" x="388" y="528">and applies rule-based checks.</text>

  <rect class="box box-slate" x="705" y="455" width="205" height="86" rx="16"/>
  <text class="step" x="727" y="486">Maintenance Alerts</text>
  <text class="text" x="727" y="511">Publishes maintenance.alerts</text>
  <text class="text" x="727" y="528">for backend storage and UI.</text>

  <path class="arrow" d="M275 498 H355"/>
  <path class="arrow" d="M615 498 H695"/>
  <path class="arrow-dashed" d="M807 455 V382"/>

  <text class="section" x="92" y="606">Observability path</text>

  <rect class="box box-slate" x="70" y="625" width="205" height="54" rx="14"/>
  <text class="step" x="92" y="647">Backend Metrics</text>
  <text class="small" x="92" y="665">Health and Prometheus counters</text>

  <rect class="box box-slate" x="365" y="625" width="250" height="54" rx="14"/>
  <text class="step" x="388" y="647">Prometheus</text>
  <text class="small" x="388" y="665">Scrapes backend metrics</text>

  <rect class="box box-slate" x="705" y="625" width="205" height="54" rx="14"/>
  <text class="step" x="727" y="647">Grafana</text>
  <text class="small" x="727" y="665">Starter overview dashboard</text>

  <path class="arrow" d="M275 652 H355"/>
  <path class="arrow" d="M615 652 H695"/>
  <path class="arrow-dashed" d="M770 217 C655 555 255 560 174 625"/>
</svg>
